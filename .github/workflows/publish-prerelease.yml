name: Publish prerelease
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-prerelease.yml', 'RELEASE_NOTES.md']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, simplexml, iconv
          coverage: none
      - name: Verify before publishing
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/import-test.php
          unzip -t dist/student-schedule-finder.zip
      - name: Publish version 1.3.0 as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.0 >/dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
          else
            gh release create v1.3.0 dist/student-schedule-finder.zip --target "$GITHUB_SHA" --title "Student Schedule Finder 1.3.0 — Release candidate" --prerelease --notes-file RELEASE_NOTES.md
          fi
